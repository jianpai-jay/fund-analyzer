name: Daily Fund Analysis

on:
  schedule:
    # 每天北京时间 18:00 (UTC 10:00)
    # 周一到周五运行（A股交易日）
    - cron: '0 10 * * 1-5'

  # 支持手动触发
  workflow_dispatch:
    inputs:
      force_run:
        description: '强制运行（忽略交易日判断）'
        required: false
        default: 'false'
        type: boolean

# 设置时区
env:
  TZ: Asia/Shanghai

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fund analysis
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python -m src.main

      - name: Display results
        if: always()
        run: |
          echo "分析任务执行完成"
          echo "时间: $(TZ=Asia/Shanghai date)"

      # 如果分析失败，发送错误通知
      - name: Send error notification
        if: failure()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: |
          python -c "
          import requests
          import os
          from datetime import datetime

          token = os.environ.get('PUSHPLUS_TOKEN')
          if token:
              message = f'''
              <h2>❌ 基金分析任务失败</h2>
              <p>时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}</p>
              <p>请检查 GitHub Actions 日志</p>
              '''

              payload = {
                  'token': token,
                  'title': '❌ 基金分析任务失败',
                  'content': message,
                  'template': 'html'
              }
              requests.post('http://www.pushplus.plus/send', json=payload, timeout=10)
          "

      # 清理工作流运行记录（可选）
      - name: Cleanup old workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily_analysis.yml',
              per_page: 100
            });

            // 保留最近10次运行记录
            const keepRuns = 10;
            const runsToDelete = runs.data.workflow_runs.slice(keepRuns);

            for (const run of runsToDelete) {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
            }
